# Envoyer la fiche App Store chez Apple : textes, captures, classification,
# et ce que l'examinateur doit savoir — sans rien taper dans App Store Connect.
#
# La fiche vit dans `mobile/store.config.js`, les captures dans
# `mobile/store/apple/screenshot/`. Ce travail les pousse avec la clé
# d'Apple déjà rangée pour « Application iPhone » (ASC_CLE_P8, ASC_CLE_ID,
# ASC_EMETTEUR_ID).
#
# CE QU'IL FAUT UNE SEULE FOIS — GitHub → Settings → Secrets and variables →
# Actions :
#
#   rien d'autre que la clé d'Apple. Le contact d'Apple est écrit dans la
#   fiche ; des variables APPLE_CONTACT_* ou APPLE_COPYRIGHT, si on les pose
#   un jour (onglet « Variables »), passent devant.
#
# Le compte de l'examinateur, lui, n'a rien à ranger : c'est la vitrine de
# démonstration de la plateforme (web/lib/demonstration.ts), dont les
# identifiants sont écrits dans la fiche, à dessein — ils n'ouvrent que des
# données inventées. Voir docs/APP-STORE.md pour la suite — la confidentialité
# de l'app, la réponse à l'examen et la soumission, qu'Apple réserve au
# titulaire du compte. TOTEM est une application GRAND PUBLIC, sur l'App
# Store public : aucune distribution « non répertoriée ».

name: Fiche App Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envoyer:
    name: Envoyer la fiche
    runs-on: ubuntu-latest
    steps:
      # Épinglées par empreinte, comme dans « Application iPhone » : ce travail
      # tient la clé d'Apple.
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - name: Installer Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les outils d'Expo
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e   # 8.2.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installer les dépendances
        working-directory: mobile
        run: npm ci

      # TOUT EST REGARDÉ AVANT D'ENVOYER. Une fiche sans contact part sans
      # erreur — et revient refusée trois jours plus tard. On le dit ici, en
      # une minute.
      - name: Vérifier ce qu'il faut à Apple
        env:
          P8: ${{ secrets.ASC_CLE_P8 }}
          CLE_ID: ${{ secrets.ASC_CLE_ID }}
          EMETTEUR_ID: ${{ secrets.ASC_EMETTEUR_ID }}
          EQUIPE_ID: ${{ vars.APPLE_EQUIPE_ID || secrets.APPLE_EQUIPE_ID || 'S84ML7M6Y9' }}
        run: |
          manque=""
          for nom in P8 CLE_ID EMETTEUR_ID EQUIPE_ID; do
            if [ -z "${!nom}" ]; then manque="$manque $nom"; fi
          done
          if [ -n "$manque" ]; then
            {
              echo "### Il manque de quoi remplir la fiche"
              echo ""
              echo "Pas encore posé :**$manque**"
              echo ""
              echo "GitHub → Settings → Secrets and variables → Actions."
              echo "(P8, CLE_ID, EMETTEUR_ID, EQUIPE_ID : ce sont ASC_CLE_P8, ASC_CLE_ID,"
              echo "ASC_EMETTEUR_ID et APPLE_EQUIPE_ID — les mêmes que pour « Application iPhone ».)"
            } >> $GITHUB_STEP_SUMMARY
            echo "::error::Il manque :$manque — voir le résumé."
            exit 1
          fi
          echo "Tout ce qu'Apple demande est là."

      - name: Poser la clé d'Apple
        working-directory: mobile
        env:
          P8: ${{ secrets.ASC_CLE_P8 }}
          ASC_CLE_ID: ${{ secrets.ASC_CLE_ID }}
          ASC_EMETTEUR_ID: ${{ secrets.ASC_EMETTEUR_ID }}
        run: |
          printf '%s' "$P8" > app-store-connect.p8
          if ! grep -q "BEGIN PRIVATE KEY" app-store-connect.p8; then
            echo "::error::ASC_CLE_P8 n'est pas une clé privée valable."
            exit 1
          fi
          node scripts/poser-la-cle-du-depot.mjs production ./app-store-connect.p8

      # L'ÉQUIPE APPLE SE DIT, ELLE NE SE DEVINE PAS. Sans elle, EAS la
      # demande au clavier — et en mode non interactif, il n'y a pas de
      # clavier : le premier envoi s'est arrêté là, sur « Apple Team ID: ».
      # Mêmes valeurs que pour « Application iPhone » ; à défaut, l'équipe du
      # propriétaire, écrite ici — un identifiant d'équipe n'est pas un
      # secret, il figure dans chaque application signée.
      - name: Envoyer la fiche chez Apple
        working-directory: mobile
        env:
          EXPO_ASC_API_KEY_PATH: ./app-store-connect.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_CLE_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_EMETTEUR_ID }}
          EXPO_APPLE_TEAM_ID: ${{ vars.APPLE_EQUIPE_ID || secrets.APPLE_EQUIPE_ID || 'S84ML7M6Y9' }}
          EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_EQUIPE_TYPE || secrets.APPLE_EQUIPE_TYPE || 'INDIVIDUAL' }}
          APPLE_CONTACT_PRENOM: ${{ vars.APPLE_CONTACT_PRENOM }}
          APPLE_CONTACT_NOM: ${{ vars.APPLE_CONTACT_NOM }}
          APPLE_CONTACT_COURRIEL: ${{ vars.APPLE_CONTACT_COURRIEL }}
          APPLE_CONTACT_TELEPHONE: ${{ vars.APPLE_CONTACT_TELEPHONE }}
          APPLE_COPYRIGHT: ${{ vars.APPLE_COPYRIGHT }}
        # UN VERT QUI MENT EST PIRE QU'UN ROUGE. EAS rend la main « réussi »
        # même quand Apple a refusé une partie de la fiche : le deuxième envoi
        # est sorti vert, résumé « ✅ La fiche est chez Apple », alors que le
        # nom, la description et les mots-clés avaient été refusés. On relit
        # donc ce qu'il a ÉCRIT, pas ce qu'il a RENDU.
        run: |
          set -o pipefail
          eas metadata:push --profile production --non-interactive 2>&1 | tee journal-fiche.txt
          if grep -q "upload encountered an error\|✖ Failed" journal-fiche.txt; then
            {
              echo "### ❌ Apple a refusé une partie de la fiche"
              echo ""
              if grep -q "app name you entered is already being used" journal-fiche.txt; then
                echo "**Le nom de l'application est déjà pris** par une autre app, sur un"
                echo "autre compte. Il faut en choisir un autre (champ title de"
                echo "mobile/store.config.js), puis relancer ce travail."
                echo ""
              fi
              echo "Ce qu'Apple a répondu :"
              echo ""
              echo '```'
              grep -A2 "✖\|encountered an error" journal-fiche.txt | head -20
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            echo "::error::Apple a refusé une partie de la fiche — voir le résumé."
            exit 1
          fi

      - name: Effacer la clé d'Apple
        if: always()
        working-directory: mobile
        run: rm -f app-store-connect.p8

      - name: La suite
        if: success()
        run: |
          {
            echo "### ✅ La fiche est chez Apple"
            echo ""
            echo "Textes (français et anglais), captures, classification 4+ et"
            echo "informations pour l'examinateur sont dans App Store Connect."
            echo ""
            echo "Reste ce qu'Apple réserve au titulaire du compte — voir"
            echo "**docs/APP-STORE.md** : la confidentialité de l'app, la"
            echo "réponse à l'examen (docs/APPLE-REPONSE-2.1.md), puis « Soumettre"
            echo "à nouveau ». Application grand public : pas de distribution non répertoriée."
          } >> $GITHUB_STEP_SUMMARY
