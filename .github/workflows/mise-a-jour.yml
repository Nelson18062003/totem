# Envoyer une mise à jour aux téléphones DÉJÀ installés, sans rien réinstaller.
#
# LA DIFFÉRENCE AVEC « Application Android », en une phrase : celui-là
# fabrique un paquet qu'on installe à la main et qui prend vingt minutes ;
# celui-ci pousse le nouveau code vers les applications déjà en place, et
# prend une minute.
#
# CE QUE CE CHEMIN SAIT FAIRE : tout ce qui est écrit en JavaScript — les
# écrans, les textes, les couleurs, les calculs, les corrections de bugs.
# C'est-à-dire l'écrasante majorité du travail.
#
# CE QU'IL NE SAIT PAS FAIRE : ajouter ou changer une brique NATIVE — une
# permission Android, une bibliothèque nouvelle, le fichier de Firebase, la
# version d'Android visée. Là, il faut une vraie compilation.
#
# LA RÈGLE À TENIR À LA MAIN. `app.json` porte
# `runtimeVersion: { policy: "appVersion" }` : une mise à jour ne rejoint que
# les applications qui portent le même numéro de `version`.
#
# Donc : DÈS QU'UNE BRIQUE NATIVE CHANGE, il faut MONTER `version` dans
# app.json et recompiler, avant de publier quoi que ce soit ici. Sans cela,
# une mise à jour écrite pour une bibliothèque absente de l'application
# installée la ferait planter au démarrage — et une application qui plante au
# démarrage ne peut plus recevoir la correction. Le téléphone serait mort
# pour de bon.
#
# L'empreinte automatique (« fingerprint ») a été essayée et retirée : elle
# était calculée à deux endroits qui ne voient pas le même projet — la
# machine de GitHub et le serveur d'Expo — et faisait échouer toute
# compilation sur « Runtime version mismatch ». Voir app.json.
#
# COMMENT S'EN SERVIR : onglet Actions → « Mise à jour » → Run workflow →
# choisir le canal. Le canal doit être celui du paquet installé sur le
# téléphone : « apercu » pour l'APK qu'on s'envoie à soi-même, « essai »
# pour la piste interne du Play Store, « production » pour le public.

name: Mise à jour

on:
  workflow_dispatch:
    inputs:
      canal:
        description: "Quels téléphones mettre à jour"
        required: true
        default: apercu
        type: choice
        options:
          - apercu       # l'APK qu'on s'installe soi-même
          - essai        # la piste d'essai interne du Play Store
          - production   # les téléphones du public
      message:
        description: "Ce que cette mise à jour change (visible dans Expo)"
        required: false
        default: ""
      adresse:
        description: "Adresse de la plateforme (vide = celle des réglages du dépôt)"
        required: false
        default: ""

# Le jeton de l'action ne sert qu'à LIRE le dépôt. Sans ce bloc, il hérite du
# réglage par défaut de l'organisation — souvent l'écriture sur tous les
# domaines — dans un travail qui installe des centaines de paquets et détient
# de quoi publier sur tous les téléphones. On le réduit à ce qui sert.
permissions:
  contents: read

jobs:
  publier:
    name: Publier sur « ${{ inputs.canal }} »
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - name: Installer Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les outils d'Expo
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e   # 8.2.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installer les dépendances
        working-directory: mobile
        run: npm ci

      # LES GARDE-FOUS, et ils comptent plus ici que pour une compilation.
      #
      # Une mise à jour à distance arrive sur des téléphones EN SERVICE, en
      # quelques secondes, sans que personne ne l'installe ni ne la relise.
      # Un écran cassé poussé ainsi est cassé partout, tout de suite. On ne
      # publie donc rien qui n'ait passé les vérifications.
      - name: Vérifier les types
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Vérifier les règles partagées
        working-directory: web
        run: npm ci && npm test

      # L'ADRESSE DE LA PLATEFORME, reposée dans la mise à jour.
      #
      # INDISPENSABLE ICI AUSSI, et c'est le piège : une mise à jour
      # remplace le code JavaScript de l'application. Publiée sans
      # l'adresse, elle EFFACERAIT celle que la compilation avait posée,
      # et l'écran de connexion la redemanderait — sur tous les
      # téléphones à la fois, sans que personne comprenne pourquoi.
      #
      # Le propriétaire ne doit pas avoir à taper l'adresse de son serveur
      # dans l'application : on ouvre, on met son courriel et son mot de
      # passe, on entre. C'est ici que ça se règle, une fois pour toutes.
      #
      # Elle vient d'une VARIABLE de dépôt (Settings → Secrets and variables
      # → Actions → onglet « Variables » → ADRESSE_PLATEFORME), ou du champ
      # rempli au lancement, qui l'emporte quand il est là.
      #
      # Une variable, pas un secret : une adresse web est publique par nature
      # — elle est dans la barre du navigateur de qui ouvre la plateforme. La
      # ranger comme un secret laisserait croire qu'elle en est un.
      #
      # Rien n'échoue si elle n'est pas posée : l'application demandera
      # l'adresse à l'écran, comme avant. Moins bien, pas cassé.
      # L'adresse passe par « env », jamais collée dans la ligne de commande.
      # Voir le même geste dans « application-android.yml » : « ${{ … }} » est
      # remplacé AVANT que le shell ne lise la ligne, si bien qu'une valeur
      # bien choisie y devient du code. Ce travail-ci pousse du code vers des
      # téléphones EN SERVICE : c'est le dernier endroit où l'on veut d'une
      # ligne de commande qu'on assemble à la main.
      - name: Poser l'adresse de la plateforme
        working-directory: mobile
        env:
          ADRESSE: ${{ inputs.adresse || vars.ADRESSE_PLATEFORME }}
        run: node scripts/poser-l-adresse.mjs "$ADRESSE"

      # LA BATTERIE AVANT DE PUBLIER, JAMAIS APRÈS.
      #
      # Une mise à jour à distance arrive sur des téléphones EN SERVICE, en
      # quelques secondes, sans que personne ne l'installe ni ne la relise.
      # Ce qui part d'ici est irrattrapable : un écran cassé est cassé
      # partout, tout de suite, et un secret parti est public pour toujours.
      #
      # Or c'était le SEUL chemin vers les téléphones qui ne vérifiait pas ce
      # que le paquet emporte — la compilation Android, elle, le faisait
      # depuis toujours. Le chemin le plus rapide était le moins gardé.
      #
      # `verifier-le-paquet` compile le bundle et regarde DEDANS : le noyau
      # partagé doit y être, aucun secret ne doit y être. C'est le même
      # bundle que celui publié ci-dessous.
      - name: Vérifier ce que le paquet emporte
        working-directory: mobile
        run: node scripts/verifier-le-paquet.mjs

      # Les deux défauts nés de rapports du propriétaire : un clavier qui
      # cache le champ qu'on remplit, un écran qui se tait quand le réseau
      # tombe. Statiques et immédiats — aucune raison de s'en priver sur le
      # chemin qui atteint les téléphones le plus vite.
      - name: Vérifier le clavier et les écrans
        working-directory: mobile
        run: |
          node scripts/verifier-le-clavier.mjs
          node scripts/verifier-les-ecrans.mjs

      - name: Publier la mise à jour
        working-directory: mobile
        env:
          MESSAGE_DEMANDE: ${{ inputs.message }}
          CANAL: ${{ inputs.canal }}
        run: |
          MESSAGE="$MESSAGE_DEMANDE"
          # Sans message, on prend celui du dernier commit : mieux vaut la
          # vraie raison du changement qu'une ligne vide dans l'historique.
          if [ -z "$MESSAGE" ]; then
            MESSAGE="$(git log -1 --pretty=%s)"
          fi
          eas update --channel "$CANAL" --message "$MESSAGE" --non-interactive

      - name: Ce qui est parti
        working-directory: mobile
        env:
          CANAL: ${{ inputs.canal }}
        run: |
          echo "### Mise à jour publiée sur \`$CANAL\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Les téléphones la prendront **au prochain démarrage** de" >> $GITHUB_STEP_SUMMARY
          echo "l'application. Rien à réinstaller." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          V=$(node -e "console.log(require('./app.json').expo.version)")
          echo "Elle ne rejoint que les applications en version **$V**." >> $GITHUB_STEP_SUMMARY
          echo "Une brique native a changé depuis la dernière compilation ?" >> $GITHUB_STEP_SUMMARY
          echo "Alors il fallait monter ce numéro et recompiler d'abord." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          eas update:list --branch "$CANAL" --limit 1 --json --non-interactive \
            | node -e "
              let e='';process.stdin.on('data',d=>e+=d).on('end',()=>{
                try {
                  const g=JSON.parse(e).currentPage?.[0];
                  if (!g) return;
                  console.log('- message : ' + (g.message ?? '?'));
                  console.log('- publiée le : ' + (g.createdAt ?? '?'));
                } catch { /* rien à ajouter : le résumé se suffit */ }
              });" >> $GITHUB_STEP_SUMMARY
