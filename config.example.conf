# Configuration du TOTEM
# Copiez ce fichier vers /boot/firmware/totem.conf (partition visible
# depuis un PC Windows/Mac quand la carte SD y est insérée) et remplissez-le.

[telegram]
# Clé donnée par @BotFather (ex. 7381029:AAH8f...)
jeton = COLLEZ_ICI_LA_CLE_BOTFATHER
# Votre numéro d'identité Telegram, donné par @userinfobot (ex. 123456789)
chat_id = COLLEZ_ICI_VOTRE_ID

# --- Travail à plusieurs (facultatif) --------------------------------------
# Groupe Telegram de l'équipe. Ajoutez-y le robot, puis lisez l'identifiant
# du groupe avec @userinfobot (il commence par -100…). Laissez vide pour
# rester en tête-à-tête avec le robot.
groupe =
# Qui a le droit de PILOTER la SIM (codes USSD, PIN, redémarrage du modem).
# Les autres membres du groupe voient les encaissements et les rapports,
# mais ne peuvent pas agir. Vide = seul le propriétaire ci-dessus.
admins =
# Si le groupe est en mode « Sujets » (forum), on peut ranger chaque flux
# dans son propre fil. Ouvrez le sujet, copiez son lien : le dernier nombre
# est l'identifiant à coller ici. Vide = tout arrive dans le fil général.
sujet_encaissements =
sujet_alertes =

# --- Modems ----------------------------------------------------------------
# Rien à déclarer : les modems sont détectés automatiquement au démarrage,
# un compte par SIM (MTN, Orange…). Pour voir ce que le Pi détecte :
#     python3 -m totem --modems

[totem]
nom = 🗿 TOTEM
# La langue du robot : « en » (anglais, défaut) ou « fr » (français).
# Elle vaut pour les messages Telegram, les reçus PDF et les rapports.
# Les menus USSD et les SMS de l'opérateur restent toujours tels quels :
# leur langue se règle chez l'opérateur, pas ici.
langue = en
# Heure du rapport quotidien (heure locale du Pi)
heure_rapport = 21:00
base = /var/lib/totem/journal.db
# Fermeture automatique d'une session USSD restée sans réponse (secondes)
delai_session = 180
# Au-delà de ce montant (FCFA), le code secret ne s'affiche qu'après une
# confirmation rappelant le montant et le bénéficiaire. C'est le garde-fou si
# quelqu'un met la main sur votre téléphone déverrouillé. 0 = désactivé.
seuil_confirmation = 100000
# Envoyer chaque jour une copie du journal dans la conversation, après le
# bilan. C'est la seule copie hors du Pi : une carte SD morte, et tout
# l'historique disparaît. Le fichier ne contient aucun code secret.
sauvegarde_quotidienne = oui
# Joindre un reçu PDF aux opérations comprises (transfert, solde). Il arrive
# une dizaine de secondes après l'alerte, prêt à être transmis à un client.
recus = oui

# --- Le numéro de vos puces (facultatif) -----------------------------------
# Le plus simple est de ne rien mettre ici : envoyez /reglages dans Telegram,
# et le robot vous demande le numéro et le nom de chaque puce. C'est plus sûr
# — il vous montre les cartes réellement en place — et ça n'oblige personne à
# ouvrir un fichier sur le Pi.
#
# Cette section reste pour les installations qui préfèrent tout déclarer
# d'avance. Ce qui est inscrit depuis Telegram passe devant.
#
# Pourquoi c'est nécessaire : Orange écrit « Transfert de 656483918 PRIX MONO
# SARL vers 696103864 WONDER PHONE » — il nomme les deux parties, mais ne dit
# pas laquelle est la vôtre. Sans le numéro, TOTEM refuse de deviner et écrit
# « Montant net » au lieu de « Montant reçu » ou « Montant envoyé ».
[numeros]
orange = 
mtn = 

# --- Raccourcis : un bouton = une suite de touches -------------------------
# Format :  nom = Libellé du bouton | code, touche, touche, …
# Le libellé est facultatif. Les touches sont jouées automatiquement, et le
# déroulé s'arrête tout seul dès qu'un code PIN est demandé (vous le tapez
# alors sur le pavé sécurisé). Adaptez les chiffres à VOTRE menu opérateur.
[raccourcis]
solde = 💰 Solde | *126#, 5, 1
transactions = 🧾 Dernières opérations | *126#, 5, 2

# --- Cloud (facultatif) ----------------------------------------------------
# Sans cette section, TOTEM fonctionne entièrement hors ligne, comme avant.
# Avec elle, il envoie une copie de ce qu'il voit vers Supabase, pour que
# l'application web puisse l'afficher depuis n'importe où.
#
# url : « Project URL » dans Supabase → Project Settings → API
# cle : la clé « service_role » de la même page. ⚠ SECRÈTE : elle contourne
#       toutes les règles d'accès. Elle ne doit jamais quitter ce fichier,
#       ni être collée dans une conversation, ni versionnée.
# terminal : un nom court identifiant ce boîtier (« douala », « atelier »).
[cloud]
url =
cle =
terminal = douala

# --- XAFe Exchange (facultatif) -------------------------------------------
# Sans cette section, TOTEM se comporte exactement comme avant.
# Avec elle, chaque encaissement reçu sur une carte est aussi déposé chez
# XAFe Exchange, qui crédite le client qui l'a déclaré.
#
# url : l'adresse du projet Supabase de XAFe, sans chemin
#       (le robot ajoute /functions/v1/totem-sms ; plus tard, totem-commandes)
# cle : la clé de CE boîtier chez XAFe (donnée par l'équipe XAFe). ⚠ SECRÈTE :
#       elle signe tout ce que ce boîtier dit à XAFe — qui la lit peut faire
#       créditer des comptes. Elle ne quitte jamais ce fichier.
# terminal : l'identifiant de ce boîtier CHEZ XAFe (« akwa-1 »), à l'identique.
#       Vide : le robot prend le nom de [cloud] (terminal). Un identifiant
#       inventé ici ferait répondre « refuse la signature », la panne la
#       plus difficile à voir (XAFe répond pareil pour la clé et l'horloge).
# anon : la clé publique du projet XAFe, seulement si l'équipe XAFe la demande.
# transferts : « oui » pour que le boîtier compose aussi les transferts XAFe —
#       NON tant que la question du code secret n'est pas tranchée (docs/XAFE.md).
#       Pas encore relevé par cette version du robot : « oui » n'ouvre rien
#       aujourd'hui, la valeur est lue et rangée, c'est tout.
# sorties : « oui » pour que les PAIEMENTS faits depuis la puce partent aussi
#       chez XAFe — la preuve d'un remboursement payé à la main (même ID, même
#       montant, même numéro). Ils n'y créditent jamais rien. « non » les garde
#       ici : sur une puce partagée avec Bonzini, XAFe voit aussi ses paiements.
[xafe]
url =
cle =
terminal =
anon =
transferts = non
sorties = oui
