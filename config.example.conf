# Configuration du TOTEM
# Copiez ce fichier vers /boot/firmware/totem.conf (partition visible
# depuis un PC Windows/Mac quand la carte SD y est insérée) et remplissez-le.

[telegram]
# Clé donnée par @BotFather (ex. 7381029:AAH8f...)
jeton = COLLEZ_ICI_LA_CLE_BOTFATHER
# Votre numéro d'identité Telegram, donné par @userinfobot (ex. 123456789)
chat_id = COLLEZ_ICI_VOTRE_ID

[modem]
# Port AT du SIM7600 (ne changez que si le diagnostic l'indique)
port = /dev/ttyUSB2

[totem]
nom = 🗿 TOTEM
# Heure du rapport quotidien (heure locale du Pi)
heure_rapport = 21:00
base = /var/lib/totem/journal.db
